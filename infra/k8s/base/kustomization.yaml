apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vertex-demo

resources:
  - namespace.yaml
  - pgvector.yaml
  - agent.yaml
  - frontend.yaml

configMapGenerator:
  - name: agent-config
    literals:
      - DATABASE_URL=postgresql://postgres:postgres@pgvector:5432/postgres

# agent-personas ConfigMap is NOT generated here -- kustomize's load
# restrictor blocks reading data/personas.json from outside this tree, and
# that file is gitignored/regenerated anyway (see README step 3). Run
# infra/k8s/load-personas-configmap.sh before/after `kubectl apply -k`.
